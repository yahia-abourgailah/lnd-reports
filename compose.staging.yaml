# staging overlay — VM, 2 vCPU / 4 GB.
# CRM sandbox plus an anonymised HRIS extract. Never live PII.
#
# Images are pulled by tag, never built here: what CI tested is what runs, and
# the same digest is later promoted to production unchanged.

services:
  proxy:
    ports:
      - "8080:8080"
    volumes:
      - ./docker/nginx/proxy.dev.conf:/etc/nginx/conf.d/default.conf:ro

  web:
    build: !reset null
    pull_policy: always

  api:
    build: !reset null
    pull_policy: always
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  worker:
    build: !reset null
    pull_policy: always
    command: ["celery", "-A", "lnd.worker.celery_app:celery_app", "worker",
              "--loglevel=INFO", "--concurrency=2"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  beat:
    build: !reset null
    pull_policy: always

  db:
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

# `proxy` for dev and staging-without-certs: plain HTTP on 8080.
# Production uses proxy.tls.conf instead. Same routing in both, so what you
# exercise locally is what runs behind TLS in production.

upstream lnd_api { server api:8000; keepalive 16; }
upstream lnd_web { server web:8080; keepalive 16; }

server {
    listen 8080;
    server_name _;

    client_max_body_size 8m;

    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "DENY"           always;
    add_header Referrer-Policy         "same-origin"    always;

    location /v1/ {
        proxy_pass         http://lnd_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Exports and the monthly report generate synchronously on demand.
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass         http://lnd_web;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Connection "";
    }
}

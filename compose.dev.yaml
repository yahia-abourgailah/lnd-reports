# dev overlay — local Docker Compose, anonymised fixtures, no real PII.
#
#   make up          →  http://localhost:8080
#
# Source is bind-mounted and the API runs under uvicorn --reload, so an edit is
# live without a rebuild. The image itself is still the production one; only the
# command and the mount differ.

services:
  proxy:
    ports:
      - "8080:8080"
    volumes:
      - ./docker/nginx/proxy.dev.conf:/etc/nginx/conf.d/default.conf:ro

  web:
    # Vite dev server rather than the nginx bundle, for hot module reload.
    image: node:20-alpine
    build: !reset null
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 8080"]
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    environment:
      VITE_API_BASE: /v1

  api:
    command: ["uvicorn", "lnd.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./api/src:/srv/src:ro
      - ./api/alembic:/srv/alembic:ro
      # The frozen reference dataset and its golden figures live in the
      # repository rather than in the image — the Dockerfile copies `src` and
      # `alembic` and nothing else — so the generators that replay it need this
      # mount or they run happily against nothing.
      #
      # Dev only. The runtime never reads it: nothing under `lnd.api` or
      # `lnd.worker` touches `tests`, so staging and production have no mount.
      #
      # `./docs:/docs` is deliberately absent. It was here so the generators
      # could write their documents, and it could not work: the container is
      # uid 10001 and the repository is not, so every write was refused. They
      # print to stdout now and the scripts redirect on the host, where the
      # file ends up owned by whoever ran them.
      - ./api/tests:/srv/tests
    environment:
      PYTHONPATH: /srv/src

  worker:
    volumes:
      - ./api/src:/srv/src:ro
    environment:
      PYTHONPATH: /srv/src

  beat:
    volumes:
      - ./api/src:/srv/src:ro
    environment:
      PYTHONPATH: /srv/src

  # db and redis are on the `internal: true` backend network, and Docker will
  # not publish a host port from an internal-only network — it fails silently,
  # rendering the port in `compose config` but never binding it. Attaching them
  # to `edge` as well gives the publish somewhere to bind.
  #
  # This is a dev-only concession so psql, a GUI client and host-run tests can
  # attach. staging and production keep them on `backend` alone, unreachable
  # from anywhere outside the compose project.
  db:
    networks: [backend, edge]
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    networks: [backend, edge]
    ports:
      - "127.0.0.1:6379:6379"

  # pgAdmin, with the connection pre-configured so there is nothing to set up —
  # expand Schemas and the tables are there. Dev only, like adminer.
  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "True"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      db: { condition: service_healthy }
    networks: [edge, backend]
    restart: unless-stopped

volumes:
  web-node-modules:
  pgadmin-data:

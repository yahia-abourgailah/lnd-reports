[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lnd-analytics"
version = "0.1.0"
description = "L&D Analytics Platform — API, workers and metric layer"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115,<0.117",
  "uvicorn[standard]>=0.32,<0.36",
  "gunicorn>=23.0,<24",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "authlib>=1.3.2,<2",
  "httpx>=0.27,<0.29",
  "itsdangerous>=2.2,<3",
  "celery[redis]>=5.4,<6",
  "redis>=5.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<8",
  "ruff>=0.8,<0.13",
  "mypy>=1.13,<2",
  "types-requests",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "B",         # bugbear
  "UP",        # pyupgrade
  "S",         # bandit
  "C4",        # comprehensions
  "SIM",       # simplify
  "RUF",
]
ignore = [
  "S101",  # assert is fine in tests and in transform invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hardcoded fixtures are the point
# S608: the DDL in 0001 interpolates only module-level constants — role and
# schema names — which is unavoidable, since neither can be a bind parameter.
"alembic/versions/*" = ["E501", "S608"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["celery.*", "authlib.*"]
ignore_missing_imports = true

# Celery ships no type information for @task, so every decorated function reads
# as untyped. The tasks themselves stay annotated.
[[tool.mypy.overrides]]
module = ["lnd.worker.*"]
disallow_untyped_decorators = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]  # "." so tests.fixtures is importable
addopts = "-q --cov=lnd --cov-report=term-missing"
filterwarnings = ["error::DeprecationWarning:lnd.*"]

[tool.coverage.run]
branch = true
source = ["lnd"]
omit = ["*/worker/tasks.py"]

[tool.coverage.report]
# NFR-10 raises this to 80% on transform and metrics from week 3, when there is
# something to cover. Week 1 is a skeleton.
fail_under = 70
